<template name="products_index">
	<h1>{{ i18n 'app.nav.products' }}</h1>
	<div class="toolbar">
		<input type="search" class="products-search" placeholder="{{ i18n 'products.search' }}" value="{{ searchQuery }}">
		{{#if canCreate}}
			<button class="products-add">{{ i18n 'products.add' }}</button>
		{{/if}}
	</div>
	<table class="products-table">
		<thead>
			<tr>
				<th>{{ i18n 'products.code' }}</th>
				<th>{{ i18n 'products.name' }}</th>
				<th>{{ i18n 'products.unit' }}</th>
				<th>{{ i18n 'products.total-stock' }}</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			{{#each products}}
				<tr>
					<td>{{ code }}</td>
					<td>{{ name }}</td>
					<td>{{ unitLabel }}</td>
					<td>{{ total_stock }}</td>
					<td>
						{{#if canUpdate}}
							<button class="products-edit" data-id="{{ _id }}">{{ i18n 'products.edit' }}</button>
						{{/if}}
						{{#if canDelete}}
							<button class="products-delete" data-id="{{ _id }}">{{ i18n 'products.delete' }}</button>
						{{/if}}
					</td>
				</tr>
			{{/each}}
		</tbody>
	</table>
	{{#if editing}}
		{{> products_modal}}
	{{/if}}
</template>

<template name="products_modal">
	<form class="modal products-modal">
		<h2>{{#if productId}}{{ i18n 'products.edit' }}{{else}}{{ i18n 'products.add' }}{{/if}}</h2>
		<label>{{ i18n 'products.code' }}
			<input type="text" name="code" value="{{ product.code }}">
		</label>
		<label>{{ i18n 'products.name' }}
			<input type="text" name="name" value="{{ product.name }}">
		</label>
		<label>{{ i18n 'products.unit' }}
			<select name="unit">
				<option value="pcs">{{ i18n 'unit.pcs' }}</option>
				<option value="kg">{{ i18n 'unit.kg' }}</option>
				<option value="l">{{ i18n 'unit.l' }}</option>
			</select>
		</label>
		<div class="modal-actions">
			<button type="button" class="modal-cancel">{{ i18n 'app.cancel' }}</button>
			<button type="submit">{{ i18n 'app.save' }}</button>
		</div>
		{{#if error}}
			<p class="error">{{ error }}</p>
		{{/if}}
	</form>
</template>
