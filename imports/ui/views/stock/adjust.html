<template name="stock_adjust">
	<div class="modal-overlay">
		<form class="modal stock-adjust-modal">
			<h2>{{ i18n 'stock.adjust' }}</h2>
			<label>{{ i18n 'stock.product' }}
				<input type="text" class="adjust-product" list="adjust-product-list" value="{{ productCode }}">
				<datalist id="adjust-product-list">
					{{#each productMatches}}
						<option value="{{ code }}">{{ name }}</option>
					{{/each}}
				</datalist>
			</label>
			<label>{{ i18n 'stock.location' }}
				<input type="text" class="adjust-location" list="adjust-location-list" value="{{ locationCode }}">
				<datalist id="adjust-location-list">
					{{#each locationMatches}}
						<option value="{{ code }}">{{ name }}</option>
					{{/each}}
				</datalist>
			</label>
			<label>{{ i18n 'stock.delta' }}
				<input type="number" name="delta" step="1" value="1">
			</label>
			<label>{{ i18n 'stock.reason' }}
				<select name="reason">
					<option value="">{{ i18n 'stock.reason-none' }}</option>
					<option value="correction">{{ i18n 'stock.reason-correction' }}</option>
					<option value="damage">{{ i18n 'stock.reason-damage' }}</option>
					<option value="recount">{{ i18n 'stock.reason-recount' }}</option>
					<option value="other">{{ i18n 'stock.reason-other' }}</option>
				</select>
			</label>
			<div class="modal-actions">
				<button type="button" class="button lesser modal-cancel">{{ i18n 'app.cancel' }}</button>
				<button type="submit">{{ i18n 'stock.adjust' }}</button>
			</div>
			{{#if result}}
				<p class="result">{{ adjustedText }}</p>
			{{/if}}
			{{#if error}}
				<p class="error">{{ error }}</p>
			{{/if}}
		</form>
	</div>
</template>
