<template name="login">
	<div class="login-wrap">
		<form class="login-form">
			<h1>{{ i18n 'app.name' }}</h1>
			<input type="email" name="email" placeholder="{{ i18n 'app.email' }}" required>
			<input type="password" name="password" placeholder="{{ i18n 'app.password' }}" required>
			<button type="submit">{{ i18n 'app.login' }}</button>
			{{#if error}}
				<p class="error">{{ error }}</p>
			{{/if}}
		</form>
	</div>
</template>
